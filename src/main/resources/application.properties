spring.application.name=360
server.port=8080

# Configuracion de RabbitMQ
# Lista de nodos del clúster (si el nodo 1 cae, el cliente conecta al nodo 2)
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Comportamiento de Dead Letter Queue (DLQ):
# No reenviar mensajes rechazados a la cola original para permitir el desvio al DLX
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false

# Logging
logging.level.com.pedidos._0=INFO
logging.level.org.springframework.amqp=INFO
